name: Build TWRP for SM-T575

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Free Disk Space
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: true
        android: false
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Set up Build Environment
      run: |
        sudo apt-get update
        sudo apt-get install -y git-core gnupg flex bison build-essential zip curl zlib1g-dev gcc-multilib g++-multilib libc6-dev-i386 libncurses5-dev lib32ncurses5-dev x11proto-core-dev libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc unzip fontconfig openjdk-11-jdk python2 python3
        mkdir -p ~/bin
        curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
        chmod a+x ~/bin/repo
        echo "$HOME/bin" >> $GITHUB_PATH

    - name: Initialize TWRP Source Tree
      run: |
        mkdir twrp && cd twrp
        repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
        repo sync -c -j$(nproc) --no-clone-bundle --no-tags --current-branch

    - name: Clone Device Tree and Download Kernel
      run: |
        cd twrp
        git clone https://github.com/${{ github.repository }}.git device/samsung/gtactive3
        
        # Patch da dependência do omni
        if [ -f device/samsung/gtactive3/twrp_gtactive3.mk ]; then
          sed -i 's|vendor/omni/config/common.mk|vendor/twrp/config/common.mk|g' device/samsung/gtactive3/twrp_gtactive3.mk
        fi

        # Descarrega o kernel de 31MB e garante permissões
        curl -L -o device/samsung/gtactive3/kernel "https://files.catbox.moe/qtso3p"
        chmod 644 device/samsung/gtactive3/kernel

        # Duplica o DTB para cobrir as variantes exigidas pelo Ninja
        if [ -f device/samsung/gtactive3/dtb ]; then
          cp device/samsung/gtactive3/dtb device/samsung/gtactive3/dtb.img
          mkdir -p out/target/product/gtactive3/
          cp device/samsung/gtactive3/dtb out/target/product/gtactive3/dtb.img
          cp device/samsung/gtactive3/dtb out/target/product/gtactive3/dtb
        fi

        ls -la device/samsung/gtactive3/

    - name: Compile TWRP
      run: |
        cd twrp
        export ALLOW_MISSING_DEPENDENCIES=true
        source build/envsetup.sh
        lunch twrp_gtactive3-eng
        mka recoveryimage -j$(nproc)

        # Empacotamento para Odin (.tar)
        cd out/target/product/gtactive3
        
        if [ -f "recovery.img" ]; then
          echo "recovery.img encontrado na raiz de saída. Empacotando..."
          tar -cvf twrp_SM-T575.tar recovery.img
        else
          echo "recovery.img não encontrado na raiz, a procurar nas subpastas..."
          IMG_FILE=$(find . -name "recovery.img" | head -n 1)
          if [ -n "$IMG_FILE" ]; then
            cp "$IMG_FILE" ./recovery.img
            tar -cvf twrp_SM-T575.tar recovery.img
          else
            echo "Erro: recovery.img não foi gerado."
            exit 1
          fi
        fi

    - name: Upload TWRP Tar to GitHub Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: TWRP_SM-T575_Odin
        path: twrp/out/target/product/gtactive3/twrp_SM-T575.tar
